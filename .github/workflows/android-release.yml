name: 🚀 Android Release Bundle

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play track (internal / alpha / beta / production)'
        required: false
        default: 'internal'

jobs:
  build:
    name: Build AAB
    runs-on: ubuntu-latest
    environment: Production

    steps:
      # ── Guard: never run on main ───────────────────────────────────────────
      - name: Guard against main
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          echo "::error::This workflow must not run on the main branch. Select 'Movil-app-18432726806357977157'."
          exit 1

      # ── Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Node 22 ───────────────────────────────────────────────────────────
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # ── Java 17 (required by Gradle / Android build tools) ────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── Android SDK ───────────────────────────────────────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ── Install JS dependencies ───────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── Build web assets ──────────────────────────────────────────────────
      - name: Build web (Vite)
        run: npm run build

      # ── Sync Capacitor → Android ──────────────────────────────────────────
      - name: Capacitor sync Android
        run: npx cap sync android

      # ── Restore keystore from secret ──────────────────────────────────────
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore

      # ── Create keystore.properties ────────────────────────────────────────
      - name: Create keystore.properties
        run: |
          cat > android/keystore.properties <<EOF
          storeFile=app/release.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      # ── Gradle permissions ────────────────────────────────────────────────
      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      # ── Build release AAB ─────────────────────────────────────────────────
      - name: Build release AAB
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      # ── Upload AAB artifact ───────────────────────────────────────────────
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
